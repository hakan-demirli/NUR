[project]
name = "opencode-goal"
version = "0.1.0"
description = "Goal/loop orchestrator daemon for opencode worker sessions"
requires-python = ">=3.11"

[project.scripts]
opencode-goal = "goal_orchestrator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["goal_orchestrator*"]
