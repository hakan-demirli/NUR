[project]
name = "opencode-office"
version = "0.1.0"
description = "Standalone OpenCode worker/judge orchestrator"
requires-python = ">=3.11"

[project.scripts]
opencode-office = "office_orchestrator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["office_orchestrator*"]
