[workspace]
members = [
  "crates/raider-tui",
  "crates/raider-opencode",
  "crates/raider-plugin-lua",
  "crates/raider-host",
  "crates/raider",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1.48", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
textwrap = "0.16"
pulldown-cmark = "0.10"
syntect = { version = "5.2", default-features = false, features = [
  "default-fancy",
] }
two-face = { version = "0.5", default-features = false, features = [
  "syntect-fancy",
] }
fuzzy-matcher = "0.3"
unicode-width = "0.1"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
] }
futures = "0.3"
url = "2.5"
bytes = "1.7"
clap = { version = "4.5", features = ["derive", "env"] }
async-trait = "0.1"
mlua = { version = "0.11.6", features = ["lua54", "vendored", "send"] }
