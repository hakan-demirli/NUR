[package]
name = "raider-opencode"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "Minimal HTTP/SSE client for the opencode instance API."

[lib]
name = "raider_opencode"
path = "src/lib.rs"

[dependencies]
reqwest = { workspace = true }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "io-util",
] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
url = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "io-util",
  "test-util",
] }
