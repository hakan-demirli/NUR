[package]
name = "raider-host"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "Bridge between raider-opencode (wire) and raider-tui (App)."

[lib]
name = "raider_host"
path = "src/lib.rs"

[dependencies]
raider-opencode = { path = "../raider-opencode" }
raider-plugin-lua = { path = "../raider-plugin-lua" }
raider-tui = { path = "../raider-tui" }
tokio = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "io-util",
  "test-util",
] }
