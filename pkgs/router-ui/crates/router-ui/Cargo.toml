[package]
name = "router-ui"
description = "Touchscreen UI for the GL-BE10000 LCD"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "router-ui"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["slint/backend-winit", "slint/renderer-software"]
touch-debug = []
router = [
  "slint/renderer-software",
  "dep:framebuffer",
  "dep:evdev",
  "dep:libc",
  "dep:bytemuck",
]

[dependencies]
router-auth = { path = "../router-auth" }
slint = { version = "=1.8.0", default-features = false, features = [
  "std",
  "compat-1-2",
] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
env_logger = "0.11"
qrcode = { version = "0.14", default-features = false }
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }

framebuffer = { version = "0.3", optional = true }
evdev = { version = "0.13", optional = true }
libc = { version = "0.2", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }

[build-dependencies]
slint-build = "=1.8.0"
serde_json = { workspace = true }
